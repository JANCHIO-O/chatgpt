<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>移送清单</title>
</head>
<body>

<h2>移送清单（已移送）</h2>

<table border="1">
    <tr>
        <th>ISBN</th>
        <th>书名</th>
        <th>数量</th>
        <th>目标位置</th>
        <th>移送状态</th>
    </tr>

    <tr th:each="book : ${transferList}">
        <td th:text="${book.isbn}"></td>
        <td th:text="${book.bookName}"></td>
        <td th:text="${book.amount}"></td>
        <!-- ⭐ 正确字段名 -->
        <td th:text="${book.location}"></td>
        <td th:text="${book.transferStatus}"></td>
    </tr>
</table>

<form action="/catalog/notice/publish" method="post">
    <button type="submit">📢 发布新书通报</button>
</form>

<p>
    <a href="/catalog/index">返回编目首页</a>
</p>

</body>
</html>
